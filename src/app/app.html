<div class="grid grid-rows-[auto_1fr_auto] h-screen">
  <app-header class="sticky top-0 z-50 w-full"></app-header>

  <div class="p-4 overflow-y-auto">
    <router-outlet />
  </div>

  <app-footer class="sticky bottom-0 z-50 w-full"></app-footer>
</div>

<div class="fixed top-4 right-4 z-50 space-y-2">
  <ng-template #toastContainer></ng-template>
</div>

<ngx-spinner bdColor="rgba(0, 0, 0, 0.8)" size="medium" color="#fff" type="line-scale" [fullScreen]="true"
  name="primary">
  <p style="color: white"> Carregando... </p>
</ngx-spinner>
