<!-- Modal Overlay -->
@if(isOpen) {
<div
  class="fixed inset-0 bg-black/50 bg-opacity-50 flex items-center justify-center z-50 transition-opacity duration-300"
  (click)="onBackd10pClick()">
  <!-- Modal Container -->`
  <div class="bg-white rounded-md shadow-lg p-3 relative z-10 animate-fade-in min-h-96"
    (click)="$event.stopPropagation()" [ngClass]="{
  'w-1/4': size === 'small',
  'w-1/2': size === 'medium',
  '!w-3/4': size === 'large',
  'bg-blue-200': true
}">
    <div class="flex items-start justify-between mb-2">
      <div class="text-lg font-semibold text-gray-700">
        {{title}}
      </div>

      <!-- Close Button -->
      <button
        class="h-6 w-6 rounded flex items-center justify-center text-gray-500 hover:bg-gray-200 hover:text-gray-700 cursor-pointer"
        (click)="closeModal()">
        ✕
      </button>
    </div>

    <!-- Modal Content -->
    <ng-content></ng-content>
  </div>
</div>
}
