<header class="flex items-center h-20 bg-white shadow-sm border-b border-gray-100 w-full px-6">

  <div class="shrink-0 mr-8">
    <span class="text-xl font-black tracking-tight text-emerald-600">PDV CAIXA</span>
  </div>

  <nav class="flex items-center justify-center h-full grow">
    @for (item of items(); track item.routerLink) {
    <a (click)="navigateItem(item)"
      class="group flex items-center gap-2 cursor-pointer relative px-5 h-full text-gray-500 hover:text-gray-900 hover:bg-gray-50 transition-all duration-200"
      [class.active]="itemSelected() === item">

      <i [class]="item.icon" class="text-xl transition-colors group-[.active]:text-emerald-600"></i>
      <span class="text-sm font-semibold transition-colors group-[.active]:text-emerald-600">
        {{item.label}}
      </span>

      <span
        class="absolute bottom-0 left-0 h-1 w-0 bg-emerald-600 transition-all duration-300 group-[.active]:w-full"></span>
    </a>
    }
  </nav>

  <div
    class="flex items-center gap-3 cursor-pointer pl-4 h-full border-l border-gray-100 hover:bg-gray-50 transition-colors"
    [cdkMenuTriggerFor]="menu">

    <div class="text-right hidden sm:block">
      <span class="block text-sm font-bold text-gray-800">Carlos Stringer</span>
      <span class="block text-[10px] uppercase tracking-widest text-gray-400">Vendedor</span>
    </div>

    <div class="relative w-10 h-10">
      <img src="https://github.com/stringercj12.png"
        class="w-full h-full rounded-full border-2 border-emerald-500 p-0.5 object-cover" alt="Avatar">
      <div class="absolute bottom-0 right-0 w-3 h-3 bg-emerald-500 border-2 border-white rounded-full"></div>
    </div>
  </div>
</header>

<ng-template #menu>
  <div class="w-56 bg-white rounded-lg shadow-xl ring-1 ring-black ring-opacity-5 p-1 mt-2 focus:outline-none" cdkMenu>
    @for (menuItem of userMenuItems(); track menuItem.label) {
    @if (menuItem.separator) {
    <div class="h-px bg-gray-100 my-1"></div>
    } @else {
    <button
      (click)="menuItem.routerLink ? navigateItem({ routerLink: menuItem.routerLink }) : menuItem.command?.(menuItem)"
      class="w-full flex items-center gap-3 px-3 py-2 text-sm rounded-md transition-colors"
      [ngClass]="menuItem.styleClass ?? 'text-gray-700 hover:bg-gray-100'" cdkMenuItem>
      <i [class]="menuItem.icon" class="text-lg opacity-70"></i>
      {{ menuItem.label }}
    </button>
    }
    }
  </div>
</ng-template>
