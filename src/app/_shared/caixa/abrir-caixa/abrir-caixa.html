<section class="bg-white rounded-lg overflow-hidden flex flex-col max-w-4xl shadow-2xl">
  <header class="flex items-center justify-between p-4 border-b border-gray-100">
    <h1 class="text-xl font-semibold text-gray-800">Abrir Caixa</h1>
    <button (click)="closeModal()" class="text-gray-400 hover:text-red-500 transition-colors cursor-pointer">
      <i class="ph ph-x-circle text-3xl"></i>
    </button>
  </header>

  <main [formGroup]="form" class="p-6">
    <div class="relative grid grid-cols-1 md:grid-cols-2 gap-12">
      
      <div class="space-y-6">
        <div class="grid grid-cols-3 gap-4">
          <div>
            <label class="label-form">Caixa</label>
            <input type="text" formControlName="caixa" class="input-form" placeholder="Ex: Caixa 01">
          </div>
          <div>
            <label class="label-form">Data</label>
            <input type="date" formControlName="data" class="input-form">
          </div>
          <div>
            <label class="label-form">Hora</label>
            <input type="time" formControlName="hora" class="input-form">
          </div>
        </div>

        <div>
          <label class="label-form mb-3">Forma de Abertura</label>
          <div class="grid grid-cols-3 gap-2">
            @for (item of tiposPagamento(); track item.value) {
              <button 
                type="button"
                (click)="form.patchValue({tipoPagamento: item.value})"
                [class.border-emerald-500]="form.value.tipoPagamento === item.value"
                [class.bg-emerald-50]="form.value.tipoPagamento === item.value"
                class="flex flex-col items-center justify-center p-3 border rounded-md hover:bg-gray-50 transition-all cursor-pointer">
                <i class="ph ph-{{item.icon}} text-2xl mb-1 text-gray-600"></i>
                <span class="text-xs font-medium">{{item.label}}</span>
              </button>
            }
          </div>
        </div>
      </div>

      <div class="hidden md:block absolute inset-y-0 left-1/2 w-px -translate-x-1/2 bg-gray-200"></div>

      <div class="flex flex-col">
        <h2 class="text-center text-sm font-bold uppercase tracking-widest text-gray-400 mb-4">
          Valor em {{ form.value.tipoPagamento | uppercase }}
        </h2>

        <div class="bg-gray-50 p-6 rounded-xl border-2 border-gray-100 mb-6">
          <span class="block text-right text-4xl font-mono font-bold text-emerald-600">
            {{ form.value.valorFundo | currency:'BRL' }}
          </span>
        </div>

        <div class="grid grid-cols-3 gap-2">
          @for (tecla of tecladoNumerico; track tecla) {
            <button 
              type="button"
              (click)="handleTeclado(tecla)"
              class="h-14 bg-white border border-gray-200 rounded-lg text-xl font-semibold hover:bg-gray-100 active:scale-95 transition-all shadow-sm">
              {{ tecla }}
            </button>
          }
        </div>
      </div>
    </div>
  </main>

  <footer class="p-6 bg-gray-50 flex flex-col md:flex-row items-center justify-between gap-4">
    <p class="text-sm text-gray-500 flex items-center gap-2">
      <i class="ph ph-info text-emerald-500 text-lg"></i>
      Confirme o valor de fundo para iniciar as operações.
    </p>
    <div class="flex gap-3 w-full md:w-auto">
      <button (click)="closeModal()" class="btn-secondary flex-1 md:w-32">Cancelar</button>
      <button (click)="confirmarAbertura()" [disabled]="form.invalid" class="btn-primary flex-1 md:w-48">
        Abrir Caixa
      </button>
    </div>
  </footer>
</section>
